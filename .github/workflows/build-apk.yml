name: Build Rajesh Babu Music APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q RajeshBabuMusic.zip -d extracted
          ls -la extracted/RajeshBabuMusic

      - name: Build APK
        working-directory: extracted/RajeshBabuMusic
        run: |
          gradle --no-daemon clean assembleDebug
          ls -lh app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 100000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RajeshBabuMusic-Real-APK
          path: extracted/RajeshBabuMusic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
