name: Build Rajesh Babu Music APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q RajeshBabuMusic.zip -d extracted
          cd extracted/RajeshBabuMusic
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RajeshBabuMusic-APK
          path: extracted/RajeshBabuMusic/app/build/outputs/apk/debug/app-debug.apk
